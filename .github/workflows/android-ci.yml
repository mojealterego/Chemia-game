name: Android CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ "codex/**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36 SDK
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests
        run: gradle :app:testAdultDebugUnitTest :app:testPlayDebugUnitTest --stacktrace

      - name: Compile Compose UI tests
        run: gradle :app:compileAdultDebugAndroidTestKotlin :app:compilePlayDebugAndroidTestKotlin --stacktrace

      - name: Lint
        run: gradle :app:lintAdultDebug :app:lintPlayDebug --stacktrace

      - name: Build installable APKs
        run: gradle :app:assembleAdultDebug :app:assemblePlayDebug --stacktrace

      - name: Build Play AAB
        run: gradle :app:bundlePlayRelease --stacktrace

      - name: Upload Adult APK
        uses: actions/upload-artifact@v4
        with:
          name: CHEMIA-Adult-APK
          path: app/build/outputs/apk/adult/debug/app-adult-debug.apk
          if-no-files-found: error

      - name: Upload Play APK
        uses: actions/upload-artifact@v4
        with:
          name: CHEMIA-Play-APK
          path: app/build/outputs/apk/play/debug/app-play-debug.apk
          if-no-files-found: error

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: CHEMIA-Play-AAB
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
