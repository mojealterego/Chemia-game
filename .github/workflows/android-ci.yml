name: Android CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ "codex/**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36 SDK
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests
        run: gradle :app:testAdultDebugUnitTest :app:testPlayDebugUnitTest --stacktrace

      - name: Compile Compose UI tests
        run: gradle :app:compileAdultDebugAndroidTestKotlin :app:compilePlayDebugAndroidTestKotlin --stacktrace

      - name: Lint
        run: gradle :app:lintAdultDebug :app:lintPlayDebug --stacktrace

      - name: Build installable APKs
        run: gradle :app:assembleAdultDebug :app:assemblePlayDebug --stacktrace

      - name: Build optimized release artifacts
        run: gradle :app:assembleAdultRelease :app:bundlePlayRelease --stacktrace

      - name: Verify Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT2="$BUILD_TOOLS/aapt2"
          ADULT_DEBUG="app/build/outputs/apk/adult/debug/app-adult-debug.apk"
          PLAY_DEBUG="app/build/outputs/apk/play/debug/app-play-debug.apk"
          ADULT_RELEASE="app/build/outputs/apk/adult/release/app-adult-release-unsigned.apk"
          PLAY_AAB="app/build/outputs/bundle/playRelease/app-play-release.aab"

          "$APKSIGNER" verify --verbose --print-certs "$ADULT_DEBUG"
          "$APKSIGNER" verify --verbose --print-certs "$PLAY_DEBUG"
          unzip -t "$ADULT_DEBUG" >/dev/null
          unzip -t "$PLAY_DEBUG" >/dev/null
          unzip -t "$ADULT_RELEASE" >/dev/null
          unzip -t "$PLAY_AAB" >/dev/null

          test "$("$AAPT2" dump packagename "$ADULT_DEBUG")" = "pl.chemia.game.adult"
          test "$("$AAPT2" dump packagename "$PLAY_DEBUG")" = "pl.chemia.game.play"

          if "$AAPT2" dump permissions "$ADULT_DEBUG" | grep -Eq             'android.permission.(INTERNET|CAMERA|RECORD_AUDIO|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)'; then
            echo "Forbidden permission detected in adult APK" >&2
            exit 1
          fi
          if "$AAPT2" dump permissions "$PLAY_DEBUG" | grep -Eq             'android.permission.(INTERNET|CAMERA|RECORD_AUDIO|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)'; then
            echo "Forbidden permission detected in Play APK" >&2
            exit 1
          fi

          unzip -l "$ADULT_RELEASE" | grep -q 'assets/dexopt/baseline.prof'
          unzip -l "$PLAY_AAB" | grep -q 'BUNDLE-METADATA/com.android.tools.build.profiles/baseline.prof'

          sha256sum "$ADULT_DEBUG" "$PLAY_DEBUG" "$ADULT_RELEASE" "$PLAY_AAB"             > app/build/outputs/CHEMIA-SHA256SUMS.txt

      - name: Upload Adult APK
        uses: actions/upload-artifact@v4
        with:
          name: CHEMIA-Adult-APK
          path: app/build/outputs/apk/adult/debug/app-adult-debug.apk
          if-no-files-found: error

      - name: Upload Play APK
        uses: actions/upload-artifact@v4
        with:
          name: CHEMIA-Play-APK
          path: app/build/outputs/apk/play/debug/app-play-debug.apk
          if-no-files-found: error

      - name: Upload verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: CHEMIA-SHA256SUMS
          path: app/build/outputs/CHEMIA-SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: CHEMIA-Play-AAB
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
