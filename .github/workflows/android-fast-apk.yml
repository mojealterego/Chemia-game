name: Android Fast APK

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, "codex/**" ]

concurrency:
  group: fast-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36 SDK
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Adult debug APK
        run: gradle :app:assembleAdultDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/adult/debug/app-adult-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK" >/dev/null
          test "$("$BUILD_TOOLS/aapt2" dump packagename "$APK")" = "pl.chemia.game.adult"
          if "$BUILD_TOOLS/aapt2" dump permissions "$APK" | grep -Eq             'android.permission.(INTERNET|CAMERA|RECORD_AUDIO|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)'; then
            echo "Forbidden permission detected" >&2
            exit 1
          fi
          sha256sum "$APK" | tee app/build/outputs/apk/adult/debug/CHEMIA-Adult-SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: CHEMIA-Adult-APK
          path: app/build/outputs/apk/adult/debug/app-adult-debug.apk
          if-no-files-found: error

      - name: Upload checksum
        uses: actions/upload-artifact@v7
        with:
          name: CHEMIA-Adult-SHA256
          path: app/build/outputs/apk/adult/debug/CHEMIA-Adult-SHA256.txt
          if-no-files-found: error
