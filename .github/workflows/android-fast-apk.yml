name: Android Fast APK

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ "codex/**" ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Adult debug APK
        run: gradle :app:assembleAdultDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHEMIA-Adult-APK
          path: app/build/outputs/apk/adult/debug/app-adult-debug.apk
          if-no-files-found: error
