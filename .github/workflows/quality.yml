name: CHEMIA Quality

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Smoke tests
        run: node tests/test-engine.js

      - name: Validate Android card catalogs
        run: node tests/validate-card-catalogs.js
